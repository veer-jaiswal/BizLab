<header class="site-header" id="site-header"></header>

<section class="contact">
  <h1>Contact</h1>
  <p class="lead">Questions, corrections, or ideas for a topic? Send a message and I&rsquo;ll reply by email.</p>
  <form id="contact-form" action="https://formsubmit.co/hridayveer.3@gmail.com" method="POST"><input type="hidden" name="_subject" value="New message from BizLab" /><input type="hidden" name="_template" value="table" /><input type="hidden" name="_captcha" value="false" /><input type="hidden" name="_next" id="next-url" value="" />

    <label for="email">Your email</label><input id="email" name="email" type="email" required autocomplete="email" />
    <label for="message">Message</label><textarea id="message" name="message" rows="7" required></textarea>
    <input type="text" name="_honey" tabindex="-1" autocomplete="off" style="display:none" />
    <button class="button" type="submit">Send message</button>
    <p id="form-status" role="status" aria-live="polite"></p>
  </form>
</section></main>
